plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Set by the port to the Java version this Minecraft release ships to end users.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

minecraft {
    useDefaultAccessTransformer()

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all',
                    '--output', layout.projectDirectory.dir('src/generated/resources'),
                    '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${neo_version}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = project.file("repo").toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ForgeGradle scans a merged source set, which is only populated once the classes exist. Without
// this, a run started from a clean build directory finds resources but no @Mod class and FML
// reports the mod as missing.
// The jar task writes its own manifest, so the attribute has to be declared here as well
// as in resources, or the published jar loses it.
jar {
    manifest {
        attributes('MixinConfigs': 'loadbearing.mixins.json')
    }
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn tasks.named('classes')
}

// Forge's own metadata asks for jopt-simple 5.0.4, and its module graph depends on that artifact:
// modlauncher declares `requires jopt.simple`, which 5.0.4 satisfies because its module name is
// derived from the file name. Something on the classpath drags in 6.0-alpha-3, which declares
// `Automatic-Module-Name: joptsimple` with no dot and therefore cannot satisfy it, and the game
// dies with `Module jopt.simple not found, required by cpw.mods.modlauncher`. Resolving to the
// version Forge declares keeps the module graph intact.
configurations.configureEach {
    resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
}
