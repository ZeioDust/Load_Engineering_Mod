modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}

Every block in the world is assigned a material profile: weight, compressive strength, maximum
unsupported span, and soil bearing capacity. A structural solver runs whenever the world is edited
and works out which blocks still have a valid load path down to bedrock or undisturbed terrain.
Anything that does not collapses.

The mod adds no blocks. You build with what Minecraft already gives you, and inject reinforcing
grout into a foundation to double the span it can carry.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
